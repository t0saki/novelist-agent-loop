# 工艺 gate 默认值（DESIGN §6.5）。书层 book.yaml gates.overrides 可逐条 disable、改级别、改参数或加 allow。
schema: nv.gates/1
rules:
  length.total: { level: hard }
  length.beat: { level: soft, params: { tolerance: 0.4 } }
  beat.markers: { level: hard }
  end.markers: { level: hard }
  placeholder: { level: hard, params: { soft_brackets: true } }
  meta.text: { level: hard }
  repeat.intra: { level: hard, params: { min_chars: 50 } }
  repeat.cross: { level: soft, params: { window: 30, ngram: 8 } }
  lexicon: { level: soft }
  dramatize: { level: soft }
  single_sentence_paragraph: { level: soft }
  dialogue_ratio: { level: soft }
  opening_cliche: { level: soft }
