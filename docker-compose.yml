# Novelist 2.0（all-in-one）部署示例，单机 compose 部署（DESIGN D3 / IMPL §11）。
# 镜像由 GitHub Actions 构建并发布到 ghcr；这里只拉镜像，不在部署机构建（docker compose pull && up -d）。
# postgres 沿用 v1 的卷；v2 用新库 novelist2（不存在时自动创建），v1 库保持只读导入来源。
# v1 现在占用主机 8199：v2 要与 v1 并行时把 NOVELIST_PORT 设成别的端口，确认导入无误后再切到 8199。
services:
  postgres:
    image: postgres:16-alpine
    container_name: novelist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: novelist
      POSTGRES_PASSWORD: ${NOVELIST_PG_PASSWORD:?需要设置 NOVELIST_PG_PASSWORD}
      POSTGRES_DB: novelist
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelist -d novelist"]
      interval: 10s
      timeout: 5s
      retries: 5

  novelist:
    image: ghcr.io/t0saki/novelist-agent-loop:latest
    container_name: novelist2
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NOVELIST_PORT:-8199}:8000"
    volumes:
      - ./data2:/data
    environment:
      NOVELIST_DATABASE_URL: postgresql://novelist:${NOVELIST_PG_PASSWORD}@postgres:5432/novelist2
      # v1 导入来源（可在 UI 的 v1 导入页使用）；不用时可删除
      NOVELIST_V1_DATABASE_URL: postgresql://novelist:${NOVELIST_PG_PASSWORD}@postgres:5432/novelist
      NOVELIST_MASTER_KEY: ${NOVELIST_MASTER_KEY:-}
      NOVELIST_ADMIN_PASSWORD: ${NOVELIST_ADMIN_PASSWORD:-}
      NOVELIST_SESSION_SECRET: ${NOVELIST_SESSION_SECRET:-}
      NOVELIST_ISOLATION: ${NOVELIST_ISOLATION:-auto}
      # 只信任私网/回环的反代（NPM）；公网来源伪造的 X-Forwarded-For 不生效
      NOVELIST_TRUST_PROXY: ${NOVELIST_TRUST_PROXY:-loopback,uniquelocal}
